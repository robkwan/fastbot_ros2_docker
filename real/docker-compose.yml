# File: docker-compose.yml

services:
  fastbot-ros2-real:
    image: robertkwan/fastbot-ros2-docker-real:fastbot-ros2-real
    container_name: fastbot-ros2-real
    network_mode: bridge
    restart: always
    devices:
      - /dev/video0:/dev/video0
      - /dev/ttyACM0:/dev/lslidar
      - /dev/ttyUSB0:/dev/arduino_nano
    environment:
      - DISPLAY=${DISPLAY}
    privileged: true

  fastbot-ros2-real-slam:
    image: robertkwan/fastbot-ros2-docker-real:fastbot-ros2-real-slam
    container_name: fastbot-ros2-real-slam
    network_mode: bridge
    restart: always
    command: bash -c "source install/setup.bash && ros2 launch fastbot_slam cartographer.launch.py"

